<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro da Empresa - Respire Bem</title>
  <link rel="stylesheet" href="style.css" />
 
</head>
<link rel="icon" href="/favicon.ico" type="image/x-icon" />

<body>
  <div class="background">
    <div class="container">
      <div class="left-box">
        <img src="imag.01.png" alt="Logo Respire Bem" class="logo" />
        <h2>Bem Vindo!</h2>
        <p>
          Conectando empresas, colaboradores e psicólogos para <strong>promover saúde mental no ambiente de trabalho</strong>.
        </p>
        <a href="login.html" class="voltar">Voltar para o Login</a>
      </div>
      <div class="right-box">
        <h2>Cadastrar Empresa</h2>
        <form>
          <input type="text" placeholder="Nome da Empresa" required />
          <input type="text" placeholder="CNPJ da Empresa" required />
          <input type="email" placeholder="E-mail da Empresa" required />
          <input type="password" placeholder="Senha" required />
          <button type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
